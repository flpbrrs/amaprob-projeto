[project]
name = "amaprob"
version = "0.1.0"
description = "Estimação probabilística do carboidrato de refeições brasileiras a partir de registros alimentares incompletos (POF 2017–2018)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gpytorch>=1.15.2",
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "plotnine>=0.15.9",
    "scipy>=1.18.1",
    "scoringrules>=0.11.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
